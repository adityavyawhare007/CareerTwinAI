<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skill Analysis | Career Twin AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/skill_analysis.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<div class="header">

<h1>📊 AI Skill Analysis</h1>

<p>

Current technical skill assessment.

</p>

</div>

{% for skill in skills %}

<div class="skill-card">

<div class="top">

<h3>{{ skill.name }}</h3>

<span>{{ skill.score }}%</span>

</div>

<div class="progress">

<div
class="progress-fill"

style="width: {{ skill.score }}%;">

</div>

</div>

</div>

{% endfor %}

<div class="back">

<a href="/dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</body>

</html>
