<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Career Twin AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="login-card">

        <div class="logo">

            Career <span>Twin AI</span>

        </div>

        <h1>

            Welcome Back

        </h1>

        <p>

            Login to continue using Career Twin AI

        </p>

<form action="/login" method="POST">

            <label>Email</label>

            <div class="input-box">

                <span>📧</span>

                <input
    type="email"
    name="email"
    placeholder="Enter your email"
    required>

            </div>

            <label>Password</label>

            <div class="input-box">

                <span>🔒</span>

                <input
    type="password"
    id="password"
    name="password"
    placeholder="Enter your password"
    required>

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword()">

                    👁

                </button>

            </div>

            <div class="options">

                <label>

                    <input type="checkbox">

                    Remember Me

                </label>

                <a href="#">

                    Forgot Password?

                </a>

            </div>

            <button
                type="submit"
                class="login-btn">

                Login

            </button>

        </form>

        <div class="register">

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>

</html>
