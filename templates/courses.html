<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Courses | Career Twin AI</title>

<link rel="stylesheet"
href="{{ url_for('static', filename='css/courses.css') }}">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<div class="header">

<h1>📚 AI Recommended Courses</h1>

<p>

Learn the most important skills recommended by Career Twin AI.

</p>

</div>

<div class="course-grid">

{% for course in courses %}

<div class="course-card">

<h2>

{{ course.title }}

</h2>

<p class="rating">

{{ course.rating }}

</p>

<p>

{{ course.description }}

</p>

<a href="{{ course.link }}" target="_blank">

<button>

🚀 Start Learning

</button>

</a>

</div>

{% endfor %}

</div>

<div class="back">

<a href="/dashboard">

<button>

⬅ Back to Dashboard

</button>

</a>

</div>

</div>

</body>

</html>
