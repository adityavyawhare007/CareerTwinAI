<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Career Twin AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="register-card">

        <div class="logo">

            Career <span>Twin AI</span>

        </div>

        <h1>

            Create Account

        </h1>

        <p>

            Join Career Twin AI and begin your AI career journey.

        </p>

<form action="/register" method="POST">

    <label>Full Name</label>

    <div class="input-box">
        <span>👤</span>

        <input
        type="text"
        name="full_name"
        placeholder="Enter your full name"
        required
        pattern="[A-Za-z ]{3,50}"
        title="Name should contain only letters and spaces.">
    </div>

    <label>Email</label>

    <div class="input-box">
        <span>📧</span>

        <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required>
    </div>

    <label>Mobile Number</label>

    <div class="input-box">
        <span>📱</span>

        <input
        type="tel"
        name="mobile"
        placeholder="Enter your mobile number"
        required
        pattern="[0-9]{10}"
        maxlength="10"
        oninput="this.value=this.value.replace(/[^0-9]/g,'')"
        title="Enter exactly 10 digits.">
    </div>

    <label>Education</label>

<div class="input-box">

    <span></span>

    <select name="education" required>

        <option value="" selected disabled>🎓 Select Branch</option>

        <option value="Computer Engineering">Computer Engineering</option>

        <option value="Information Technology">Information Technology</option>

        <option value="Artificial Intelligence & Machine Learning">Artificial Intelligence & Machine Learning</option>

        <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>

        <option value="Computer Science">Computer Science</option>

        <option value="Software Engineering">Software Engineering</option>

        <option value="Cyber Security">Cyber Security</option>

        <option value="Data Science">Data Science</option>

        <option value="Other">Other</option>

    </select>

</div>

                <label>Password</label>

    <div class="input-box">

        <span>🔒</span>

        <input
        type="password"
        id="password"
        name="password"
        placeholder="Create password"
        required
        pattern="^(?=.*[A-Z])(?=.*\d).{8,}$"
        title="Password must have at least 8 characters, 1 uppercase letter and 1 number.">

        <button
            type="button"
            class="show-password"
            onclick="togglePassword('password', this)">
            👁
        </button>

    </div>

    <label>Confirm Password</label>

    <div class="input-box">

        <span>🔒</span>

        <input
        type="password"
        id="confirmPassword"
        name="confirm_password"
        placeholder="Confirm password"
        required>

        <button
            type="button"
            class="show-password"
            onclick="togglePassword('confirmPassword', this)">
            👁
        </button>

    </div>

    <button type="submit">

        Create Account

    </button>

</form>
        <div class="login-link">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
