<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Career Twin AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">

</head>

<body>

<div class="container">

    <div class="register-card">

        <div class="logo">

            Career <span>Twin AI</span>

        </div>

        <h1>

            Create Account

        </h1>

        <p>

            Join Career Twin AI and begin your AI career journey.

        </p>

<form action="/register" method="POST">

            <label>Full Name</label>

            <div class="input-box">

                <span>👤</span>

                <input
type="text"
name="full_name"
placeholder="Enter your full name"
required>

            </div>

            <label>Email</label>

            <div class="input-box">

                <span>📧</span>

                <input
type="email"
name="email"
placeholder="Enter your email"
required>

            </div>

            <label>Mobile Number</label>

            <div class="input-box">

                <span>📱</span>

                <input
type="tel"
name="mobile"
placeholder="Enter your mobile number"
required>

            </div>

            <label>Education</label>

            <div class="input-box">

                <span>🎓</span>

                <input
type="text"
name="education"
placeholder="Enter your education"
required>

            </div>

            <label>Password</label>

            <div class="input-box">

                <span>🔒</span>

                <input
type="password"
id="password"
name="password"
placeholder="Create password"
required>

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('password', this)">

                    👁

                </button>

            </div>

            <label>Confirm Password</label>

            <div class="input-box">

                <span>🔒</span>

                <input
type="password"
id="confirmPassword"
name="confirm_password"
placeholder="Confirm password"
required>

                <button
                    type="button"
                    class="show-password"
                    onclick="togglePassword('confirmPassword', this)">

                    👁

                </button>

            </div>

            <button
                type="submit">

                Create Account

            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
